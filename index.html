<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", sans-serif;
    }

    .card {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #e63946;
      font-size: 2.2rem;
      margin-bottom: 30px;
    }

    button {
      font-size: 1.1rem;
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .yes {
      background: #e63946;
      color: white;
    }

    .no {
      background: #adb5bd;
      color: white;
      position: absolute;
    }

    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? 💕</h1>
    <button class="yes" onclick="yesClicked()">Yes 💖</button>
    <button class="no" id="noBtn" onmouseover="moveButton()">No 🙈</button>
  </div>

  <script>
    function yesClicked() {
      document.body.innerHTML = `
        <h1 style="color: white; font-size: 3rem; text-align: center;">
          Yay! 💘 Happy Valentine’s Day! 🌹
        </h1>
      `;
    }

    function moveButton() {
      const button = document.getElementById("noBtn");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      button.style.left = x + "px";
      button.style.top = y + "px";
    }
  </script>

</body>
</html>
