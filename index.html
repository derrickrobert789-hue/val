<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine's Surprise</title>
  <style>
    /* Soft pastel Valentine color scheme */
    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #FFB3C6, #FFD4E0);
      font-family: Arial, sans-serif;
      color: #333;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: rgba(255,255,255,0.8);
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 500px;
      margin: 20px;
    }
    /* Typing text style */
    #typewriter {
      font-family: 'Courier New', monospace;
      font-size: 1.5rem;
      white-space: nowrap;
      overflow: hidden;
      border-right: 0.15em solid #c71585; /* pink cursor */
      box-sizing: border-box;
      animation: blink 0.75s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { border-color: transparent; }
      50% { border-color: #c71585; }
    }
    button {
      margin-top: 20px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem; color: white;
      background-color: #ff5e7e;
      border: none; border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      background-color: #ff3d5c;
    }
    #surprise {
      margin-top: 15px;
      font-size: 1.25rem;
      color: #c71585;
      display: none;
      opacity: 0;
      animation: fadeIn 1s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    /* Floating hearts */
    .heart {
      position: absolute;
      color: #ff5e7e;
      font-size: 1.5rem;
      opacity: 0;
      user-select: none;
      animation: floatUp 4s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-300px) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="typewriter"></h1>
    <button id="surpriseBtn">Click for Surprise!</button>
    <div id="surprise">💕 Happy Valentine's Day! 💕</div>
  </div>

  <script>
    // Typing animation with romantic phrases
    const messages = ["Be my Valentine 💖", "You are loved 💕", "Forever and always 💘", "Happy Valentine's Day!"];
    let currentMsg = 0, charIndex = 0;
    const speed = 100; // typing speed (ms)

    function typeWriter() {
      const el = document.getElementById("typewriter");
      if (charIndex < messages[currentMsg].length) {
        el.textContent += messages[currentMsg].charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, speed);
      } else {
        // Pause, then clear and show next message
        setTimeout(() => {
          el.textContent = '';
          charIndex = 0;
          currentMsg = (currentMsg + 1) % messages.length;
          typeWriter();
        }, 2000);
      }
    }
    window.onload = typeWriter;

    // Button click handler to reveal message and hearts
    document.getElementById("surpriseBtn").addEventListener("click", () => {
      const surprise = document.getElementById("surprise");
      if (surprise.style.display === "none") {
        surprise.style.display = "block";
        // Launch multiple hearts
        for (let i = 0; i < 20; i++) {
          setTimeout(createHeart, i * 300);
        }
      }
    });

    // Create and animate a heart
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.bottom = "0px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }
  </script>
</body>
</html>
