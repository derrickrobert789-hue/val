<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wonderla or The Beach — Choose 1 or 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg: #070b16;
      --text: #e8eeff;
      --muted: #9fb0d1;
      --card: #0f1730;
      --stroke: rgba(255,255,255,.08);
      --accent: #4cc9f0;
      --accent-2: #f72585;
      --success: #00d090;
      --warn: #ffd166;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; color:var(--text); background:#050a16;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 800px at 15% -10%, #1b2a4b 0%, #0c1326 40%, #070b16 100%),
        radial-gradient(600px 600px at 90% 10%, rgba(247,37,133,.15), transparent 50%),
        radial-gradient(900px 900px at 10% 100%, rgba(76,201,240,.12), transparent 60%);
      min-height:100vh; padding:24px;
    }
    .wrap{max-width:1100px; margin:0 auto;}
    header{margin-bottom:18px; position:relative;}
    header h1{margin:0 0 4px; font-size:clamp(1.4rem, 2.6vw, 2.1rem);}
    header p{margin:0; color:var(--muted)}

    /* Hero shimmer */
    .hero{
      margin-top:14px;
      background: linear-gradient(140deg, rgba(76,201,240,.15), rgba(247,37,133,.12));
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      padding:14px 16px;
      position:relative; overflow:hidden;
    }
    .hero::after{
      content:''; position:absolute; inset:-60% auto auto -30%;
      width:60%; height:200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
      transform: skewX(-20deg); animation: shine 6s linear infinite;
      pointer-events:none;
    }
    @keyframes shine { 0%{left:-60%} 100%{left:120%} }

    .grid{display:grid; grid-template-columns:1.2fr .8fr; gap:16px; margin-top:16px}
    @media (max-width:880px){ .grid{grid-template-columns:1fr; } }

    .card{
      background: linear-gradient(180deg, #0f1a30, #0d162a);
      border:1px solid var(--stroke); border-radius:var(--radius); overflow:hidden;
      box-shadow:var(--shadow); position:relative;
    }
    .card .head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-bottom:1px solid var(--stroke);}
    .card .head h2{margin:0; font-size:1.05rem}
    .pill{font-size:.8rem; padding:6px 10px; border-radius:999px; color:#02121f;
      background: linear-gradient(135deg, #aaf1ff, #7dd3fc); border:1px solid rgba(255,255,255,.35);}
    .body{padding:14px}

    /* Wonderla gallery */
    .gallery{
      display:grid; grid-template-columns:1fr; gap:12px;
    }
    .main-img{
      position:relative; border-radius:14px; overflow:hidden;
      height:300px; background:#081224; border:1px solid var(--stroke);
    }
    .main-img img{width:100%; height:100%; object-fit:cover; display:block;
      filter:saturate(1.05) contrast(1.03);
      transition: transform .5s ease, filter .5s ease;
    }
    .main-img:hover img{transform: scale(1.03)}
