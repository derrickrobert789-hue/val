<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Roy 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --red:#e63946;
      --bg1:#ff9a9e;
      --bg2:#fad0c4;
      --shadow:0 10px 30px rgba(0,0,0,.18);
    }

    *{box-sizing:border-box}
    body {
      margin:0;
      min-height:100vh;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      padding: 20px;
    }

    .card {
      background:#fff;
      width:min(900px, 100%);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* ----- HERO CAROUSEL ----- */
    .hero {
      position:relative;
      height:320px;
      overflow:hidden;
      background:#000;
    }
    .slides {
      display:flex;
      width:400%;
      height:100%;
      transition:transform .7s ease-in-out;
    }
    .slide{
      width:100%;
      position:relative;
      flex:0 0 100%;
    }
    .slide img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter: contrast(1.05) saturate(1.05);
    }
    .hero .dots{
      position:absolute;
      bottom:14px;
      left:0; right:0;
      display:flex;
      justify-content:center;
      gap:8px;
    }
    .dot{
      width:8px; height:8px;
      border-radius:50%;
      background:rgba(255,255,255,.6);
      border:1px solid rgba(255,255,255,.9);
      cursor:pointer;
    }
    .dot.active{ background:#fff; }

    /* ----- CONTENT ----- */
    .body {
      padding: 28px 24px 8px;
    }
    .heading {
      color: var(--red);
      font-size: clamp(1.6rem, 1.4rem + 1.2vw, 2rem);
      margin: 0 0 14px;
      text-align:center;
    }

    .letter {
      font-size: 1.05rem;
      color: #444;
      line-height: 1.8;
      margin: 0 auto 22px;
      max-width: 720px;
      background: #fff6f7;
      border: 1px solid #ffd7dd;
      border-radius: 16px;
      padding: 18px 18px;
    }

    .signature {
      margin-top: 14px;
      font-style: italic;
      color: var(--red);
      text-align: right;
    }

    .cta {
      display:flex;
      justify-content:center;
      gap:14px;
      margin: 8px 0 18px;
    }
    button {
      font-size: 1.05rem;
      padding: 12px 22px;
      border: none;
      border-radius: 28px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow .18s ease;
    }
    .yes { background: var(--red); color: #fff; box-shadow: 0 6px 16px rgba(230,57,70,.35); }
    .no  { background: #adb5bd; color: #fff; position: relative; }
    button:hover { transform: translateY(-1px) scale(1.04); }

    /* ----- GALLERY ----- */
    .gallery-wrap{
      padding: 0 18px 24px;
    }
    .gallery-title{
      text-align:center;
      color:#b02430;
      margin: 8px 0 12px;
      font-weight:600;
      letter-spacing:.2px;
    }
    .gallery{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
    }
    .tile{
      position:relative;
      overflow:hidden;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      background:#f3f3f3;
      aspect-ratio: 4/5;
    }
    .tile img{
      width:100%; height:100%;
      object-fit:cover;
      transition: transform .35s ease;
      display:block;
    }
    .tile:hover img{ transform: scale(1.05); }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 900px){
      .hero{ height: 280px; }
      .gallery{ grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px){
      .hero{ height: 230px; }
      .gallery{ grid-template-columns: repeat(2, 1fr); }
      .letter{ padding:16px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- HERO CAROUSEL WITH YOUR IMAGES -->
    <div class="hero">
      <div class="slides" id="slides">
        <div class="slide"><img src="my image-10.jpg" alt="Memory 1"></div>
        <div class="slide"><img src="my image-02.jpg" alt="Memory 2"></div>
        <div class="slide"><img src="image-03.jpg" alt="Memory 3"></div>
