<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine’s Surprise</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --pink-1:#FFB3C6;
      --pink-2:#FFD4E0;
      --accent:#c71585;
      --btn:#ff5e7e;
      --btn-hover:#ff3d5c;
      --text:#333;
      --panel-bg: rgba(255,255,255,0.85);
      --shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    /* Base layout */
    html,body{
      height:100%;
    }
    body{
      margin:0;
      display:flex; align-items:center; justify-content:center;
      background: linear-gradient(135deg, var(--pink-1), var(--pink-2));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      overflow:hidden;
    }

    /* Background canvas for confetti */
    #fxCanvas{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
    }

    /* Ambient hearts layer (behind the card) */
    .ambient{
      position:fixed; inset:0;
      overflow:hidden; pointer-events:none; z-index:0;
    }

    .card{
      position:relative; z-index:1;
      width:min(92vw, 560px);
      background: var(--panel-bg);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px 22px;
      text-align:center;
      backdrop-filter: blur(6px);
    }

    /* Typewriter headline */
    #typewriter{
      font-family: ui-monospace, SFMono-Regular, Menlo, "Courier New", monospace;
      font-size: clamp(1.25rem, 2.5vw + 1rem, 1.75rem);
      white-space: nowrap; overflow:hidden;
      border-right: .15em solid var(--accent);
      box-sizing: border-box;
      margin: 0 auto 10px;
      max-width: 100%;
      animation: caretBlink .8s step-end infinite;
    }
    @keyframes caretBlink{
      0%,100%{ border-color: transparent; }
      50%{ border-color: var(--accent); }
    }

    .subtitle{
      margin: 0 0 12px;
      opacity:.85;
      font-size:.95rem;
    }

    .actions{
      display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
      margin-top:12px;
    }

    button{
      appearance:none; border:none; cursor:pointer;
      padding: .8rem 1.2rem; border-radius:10px;
      background: var(--btn); color:#fff; font-weight:600;
      box-shadow: 0 6px 16px rgba(255,94,126,.35);
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    button:hover{ transform: translateY(-2px); background: var(--btn-hover); }
    button:active{ transform: translateY(0); }

    /* Surprise content */
    #surprise{
      margin-top: 16px;
      font-size: 1.15rem;
      color: var(--accent);
      display:none;
      opacity:0;
      animation: fadeIn 900ms ease forwards;
    }
    @keyframes fadeIn{ to{ opacity:1; } }

    /* Floating hearts (ambient) */
    .heart{
      position:absolute;
      color:#ff5e7e;
      font-size: 1.25rem;
      opacity:0;
      user-select:none;
      animation: floatUp var(--dur,4s) ease-out forwards;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.15));
    }
    @keyframes floatUp{
      0%   { transform: translateY(10px) scale(var(--scale,.6)); opacity:.95; }
      90%  { opacity:.75; }
      100% { transform: translateY(-320px) scale(calc(var(--scale,.6) + .35)); opacity:0; }
    }

    .footer-note{
      margin-top: 14px;
      font-size:.85rem;
      opacity:.7;
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important; }
      .heart{ display:none !important; }
    }
  </style>
</head>
<body>
  <!-- Effects canvas -->
  <canvas id="fxCanvas" aria-hidden="true"></canvas>

  <!-- Ambient hearts layer -->
  <div class="ambient" id="ambientLayer" aria-hidden="true"></div>

  <div class="card" role="region" aria-labelledby="typewriter">
    <h1 id="typewriter" aria-live="polite" aria-atomic="true"></h1>
    <p class="subtitle">A little surprise—just for you 💝</p>

    <div class="actions">
      <button id="surpriseBtn" type="button" aria-controls="surprise" aria-expanded="false">
        Click for Surprise!
      </button>
      <button id="moreHeartsBtn" type="button">Shower Hearts ♥</button>
      <button id="confettiBtn" type="button">Confetti 🎉</button>
    </div>

    <div id="surprise" role="status">💕 Happy Valentine's Day! 💕</div>

    <p class="footer-note">Tip: Click multiple times for extra sparkle.</p>
  </div>

  <script>
    /**********************
     * Typewriter Rotator *
     **********************/
    const messages = [
      "Be my Valentine 💖",
      "You are loved 💕",
      "Forever and always 💘",
      "You make my heart smile ✨",
      "Happy Valentine's Day! 💝"
    ];
    let msgIdx = 0, charIdx = 0;
    const typeSpeed = 85, pauseMs = 1500;
    const typeEl = document.getElementById("typewriter");

    function typeNext(){
      const text = messages[msgIdx];
      if(charIdx < text.length){
        typeEl.textContent += text.charAt(charIdx++);
        setTimeout(typeNext, typeSpeed);
      } else {
        setTimeout(() => {
          typeEl.textContent = "";
          charIdx = 0;
          msgIdx = (msgIdx + 1) % messages.length;
          typeNext();
        }, pauseMs);
      }
    }
    window.addEventListener("load", typeNext);

    /*********************
     * Surprise + Hearts *
     *********************/
    const btn = document.getElementById("surpriseBtn");
    const surprise = document.getElementById("surprise");
    const ambientLayer = document.getElementById("ambientLayer");

    btn.addEventListener("click", () => {
      const isHidden = getComputedStyle(surprise).display === "none";
      if(isHidden){
        surprise.style.display = "block";
        btn.setAttribute("aria-expanded","true");
        burstHearts(26);
        confetti(220); // a bit of confetti on first reveal
      } else {
        // Toggle behavior (optional). Comment this block to keep it always visible.
        surprise.style.display = "none";
        btn.setAttribute("aria-expanded","false");
      }
    });

    // Extra hearts button
    document.getElementById("moreHeartsBtn").addEventListener("click", () => burstHearts(20));

    /****************
     * Heart Burst  *
     ****************/
    function burstHearts(count = 16){
      const vw = window.innerWidth;
      for(let i=0; i<count; i++){
        setTimeout(() => createHeart(Math.random() * vw), i * 70);
      }
    }

    function createHeart(leftPx){
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤";

      const size = 1 + Math.random() * 1.6;       // 1x to 2.6x
      const dur = 3.2 + Math.random() * 2.4;      // 3.2s to 5.6s
      const jitter = (Math.random() * 40) - 20;   // small x jitter

      heart.style.left = `${(leftPx ?? Math.random()*window.innerWidth) + jitter}px`;
      heart.style.bottom = "0px";
      heart.style.fontSize = `${size}rem`;
      heart.style.setProperty("--dur", `${dur}s`);
      heart.style.setProperty("--scale", `${0.55 + Math.random()*0.9}`);

      ambientLayer.appendChild(heart);
      setTimeout(() => heart.remove(), dur * 1000);
    }

    // Ambient hearts (gentle background)
    let ambientTimer = setInterval(() => {
      createHeart(Math.random() * window.innerWidth);
    }, 650);

    /****************
     * Confetti FX  *
     ****************/
    const canvas = document.getElementById("fxCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    let confettiPieces = [];
    let rafId = null;

    function resizeCanvas(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function confetti(count = 150){
      const colors = ["#ff5e7e","#ffd166","#06d6a0","#118ab2","#ef476f","#8338ec","#ff9f1c"];
      const w = canvas.width, h = canvas.height;

      for(let i=0;i<count;i++){
        confettiPieces.push({
          x: Math.random()*w,
          y: -10 - Math.random()*40,
          w: 6 + Math.random()*6,
          h: 8 + Math.random()*12,
          color: colors[Math.floor(Math.random()*colors.length)],
          vx: -1.5 + Math.random()*3,
          vy: 2 + Math.random()*3,
          rot: Math.random()*Math.PI*2,
          vr: (-0.2 + Math.random()*0.4),
          opacity: 0.9,
          life: 0,
          maxLife: 220 + Math.random()*100
        });
      }
      if(!rafId){ loop(); }
    }

    function loop(){
      rafId = requestAnimationFrame(loop);
      const w = canvas.width, h = canvas.height;

      ctx.clearRect(0,0,w,h);

      for(let i=confettiPieces.length-1; i>=0; i--){
        const p = confettiPieces[i];
        // physics
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03;             // gravity
        p.rot += p.vr;
        p.life++;

        // wind sway
        p.x += Math.sin((p.life + i)*0.02) * 0.5;

        // fade out near end
        if(p.life > p.maxLife - 40){ p.opacity -= 0.02; }

        // draw
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.opacity));
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();

        // cleanup
        if(p.y > h + 40 || p.opacity <= 0){
          confettiPieces.splice(i,1);
        }
      }

      if(confettiPieces.length === 0){
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    document.getElementById("confettiBtn").addEventListener("click", () => confetti(180));

    /***********************
     * Reduced Motion Honk *
     ***********************/
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      // Tone down background heart generation
      clearInterval(ambientTimer);
    }
  </script>
</body>
</html>
